<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Show do Chopão • Tex Pub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <div class="lights"></div>

    <section class="left-zone">
      <div class="hero-row">
        <div class="info-stack">
          <div class="info-card question-count">
            <span>PERGUNTA</span>
            <strong id="questionNumber">01</strong>
            <small>DE 15</small>
          </div>

          <div class="info-card timer-card">
            <span>TEMPO</span>
            <div class="timer-ring">
              <strong id="timer">30</strong>
              <small>SEG</small>
            </div>
          </div>
        </div>

        <div class="logo-stage">
          <img src="assets/show-do-chopao-logo.png" alt="Show do Chopão" class="main-logo">
        </div>
      </div>

      <section class="question-box">
        <div class="question-value">VALENDO <b id="currentPrize">R$ 10,00</b></div>
        <div class="question-text" id="questionText">
          A PEQUENA HASTE COM ALGODÃO NAS PONTAS PARA FINS HIGIÊNICOS CHAMA-SE?
        </div>
      </section>

      <section class="answers" id="answers">
        <button class="answer" data-index="0"><span class="num">1</span><span class="txt">GUARDANAPO</span></button>
        <button class="answer" data-index="1"><span class="num">2</span><span class="txt">TOALHA</span></button>
        <button class="answer" data-index="2"><span class="num">3</span><span class="txt">ALFINETE</span></button>
        <button class="answer" data-index="3"><span class="num">4</span><span class="txt">COTONETE</span></button>
      </section>

      <section class="bottom-bar">
        <div class="helpers">
          <button id="fiftyBtn"><b>👥</b><span>50/50</span></button>
          <button id="swapBtn"><b>↻</b><span>TROCA<br>PERGUNTA</span></button>
          <button id="pubBtn"><b>▥</b><span>PÚBLICO</span></button>
        </div>

        <div class="game-actions">
          <button class="action wrong" id="wrongBtn"><b>✕</b><span>ERRAR</span></button>
          <button class="action stop" id="stopBtn"><b>Ⅱ</b><span>PARAR</span></button>
          <button class="action correct" id="correctBtn"><b>✓</b><span>ACERTAR</span></button>
        </div>
      </section>

      <div class="host-nav">
        <button id="prevBtn">← ANTERIOR</button>
        <button id="nextBtn">PRÓXIMA →</button>
      </div>
    </section>

    <aside class="right-zone">
      <section class="ladder-panel">
        <div class="ladder-title">ESCADA DO CHOPÃO</div>
        <div id="ladder" class="ladder-list"></div>
      </section>

      <div class="badger-wrap">
        <img src="assets/texugo-apresentador.png" alt="Texugo apresentador" class="badger">
      </div>
    </aside>
  </main>

  <div class="overlay hidden" id="overlay">
    <div class="overlay-card">
      <div class="overlay-icon" id="overlayIcon">🍺</div>
      <div class="overlay-title" id="overlayTitle">ACERTOU!</div>
      <div class="overlay-sub" id="overlaySub"></div>
      <button id="continueBtn">CONTINUAR</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
